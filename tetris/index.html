<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Tetris JS</title>
     <link rel="manifest" href="/gaming-test/tetris/manifest.json">
    <style>
        body { background: #202028; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; margin-top: 20px; border: 2px solid #fff; }
        canvas { display: block; background-color: #000; }
        #score { font-size: 24px; margin: 10px; }
        .instructions { font-size: 0.8em; color: #aaa; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div id="score">Level: 0 | Score: 0</div>
    <div id="game-outer-container" style="display: flex; gap: 15px; align-items: flex-start; justify-content: center; width: 100%; max-width: 360px;">
        <!-- Canvas Principal -->
        <div id="game-container" style="border: 2px solid #fff;">
            <canvas id="tetris" width="240" height="400"></canvas>
        </div>
        
        <!-- Contenedor Lateral: Siguientes piezas y Botón -->
        <div id="side-panel" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <div style="text-align: center; font-size: 14px; font-weight: bold; color: #00ffcc;">SIGUIENTES</div>
            <div style="border: 2px solid #555; background: #000; padding: 5px;">
                <!-- Canvas de Siguientes Piezas (Ancho para albergar 2 piezas verticalmente) -->
                <canvas id="nextPieces" width="80" height="160"></canvas>
            </div>
            <button id="pause-btn" style="padding: 10px 15px; font-size: 14px; width: 100%;">Pausa</button>
        </div>
    </div>
    <div class="instructions">
        Desliza Lateral: Mover | Tocar: Rotar | Deslizar Abajo: Caída rápida
    </div>
    <script src="scripts/tetris.js"></script>
</body>
<script>
      // Registrar el Service Worker para habilitar el modo PWA (Instalable)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/gaming-test/tetris/scripts/sw.js')
            .then(reg => console.log('Service Worker registrado con éxito', reg))
            .catch(err => console.error('Error al registrar el Service Worker', err));
        });
      }
  </script>
</html>
