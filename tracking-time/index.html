<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .timer-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .timer-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .timer-display {
            font-size: 3.5em;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .work-timer .timer-display {
            color: #667eea;
        }

        .break-timer .timer-display {
            color: #f093fb;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-start {
            background-color: #4CAF50;
            color: white;
        }

        .btn-start:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-stop {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-stop:hover {
            background-color: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn-reset {
            background-color: #ffa500;
            color: white;
        }

        .btn-reset:hover {
            background-color: #ff9500;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
        }

        .btn-save {
            background-color: #667eea;
            color: white;
        }

        .btn-save:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            font-size: 1em;
            color: #666;
            font-weight: 500;
        }

        .running {
            color: #4CAF50;
        }

        .paused {
            color: #ff6b6b;
        }

        .history-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-left: 4px solid #667eea;
            background-color: #f9f9f9;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background-color: #f0f0f0;
            transform: translateX(5px);
        }

        .history-item.break {
            border-left-color: #f093fb;
        }

        .history-item-info {
            flex: 1;
        }

        .history-item-type {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .history-item-time {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .history-item-duration {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-right: 15px;
        }

        .history-item.break .history-item-duration {
            color: #f093fb;
        }

        .delete-btn {
            padding: 8px 15px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background-color: #ee5a52;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .summary-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .summary-item.break .summary-value {
            color: #f093fb;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .timer-display {
                font-size: 2.5em;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Time Tracking Dashboard</h1>

        <div class="dashboard">
            <!-- Work Timer -->
            <div class="timer-card work-timer">
                <h2>💼 Work Timer</h2>
                <div class="timer-display" id="workDisplay">00:00:00</div>
                <div class="button-group">
                    <button class="btn-start" id="workStart">Start</button>
                    <button class="btn-stop" id="workStop" disabled>Stop</button>
                    <button class="btn-reset" id="workReset">Reset</button>
                </div>
                <button class="btn-save" id="workSave" style="width: 100%; margin-top: 10px;" disabled>Save to History</button>
                <div class="status" id="workStatus">Ready</div>
            </div>

            <!-- Break/Pomodoro Timer -->
            <div class="timer-card break-timer">
                <h2>☕ Break Timer (Pomodoro)</h2>
                <div class="timer-display" id="breakDisplay">00:00:00</div>
                <div class="button-group">
                    <button class="btn-start" id="breakStart">Start</button>
                    <button class="btn-stop" id="breakStop" disabled>Stop</button>
                    <button class="btn-reset" id="breakReset">Reset</button>
                </div>
                <button class="btn-save" id="breakSave" style="width: 100%; margin-top: 10px;" disabled>Save to History</button>
                <div class="status" id="breakStatus">Ready</div>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-section">
            <h2>📊 Today's History</h2>
            <div class="history-list" id="historyList">
                <div class="empty-message">No timers yet. Start tracking your time!</div>
            </div>
            <div class="summary" id="summary"></div>
        </div>
    </div>

    <script>
        class Timer {
            constructor(displayId, startBtnId, stopBtnId, resetBtnId, saveBtnId, statusId, type) {
                this.display = document.getElementById(displayId);
                this.startBtn = document.getElementById(startBtnId);
                this.stopBtn = document.getElementById(stopBtnId);
                this.resetBtn = document.getElementById(resetBtnId);
                this.saveBtn = document.getElementById(saveBtnId);
                this.status = document.getElementById(statusId);
                this.type = type;

                this.seconds = 0;
                this.isRunning = false;
                this.interval = null;

                this.setupEventListeners();
            }

            setupEventListeners() {
                this.startBtn.addEventListener('click', () => this.start());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.resetBtn.addEventListener('click', () => this.reset());
                this.saveBtn.addEventListener('click', () => this.save());
            }

            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    this.saveBtn.disabled = false;
                    this.status.textContent = 'Running...';
                    this.status.classList.add('running');

                    this.interval = setInterval(() => {
                        this.seconds++;
                        this.updateDisplay();
                    }, 1000);
                }
            }

            stop() {
                if (this.isRunning) {
                    this.isRunning = false;
                    clearInterval(this.interval);
                    this.startBtn.disabled = false;
                    this.stopBtn.disabled = true;
                    this.status.textContent = 'Paused';
                    this.status.classList.remove('running');
                    this.status.classList.add('paused');
                }
            }

            reset() {
                clearInterval(this.interval);
                this.seconds = 0;
                this.isRunning = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.saveBtn.disabled = true;
                this.status.textContent = 'Ready';
                this.status.classList.remove('running', 'paused');
                this.updateDisplay();
            }

            updateDisplay() {
                const hours = Math.floor(this.seconds / 3600);
                const minutes = Math.floor((this.seconds % 3600) / 60);
                const secs = this.seconds % 60;

                this.display.textContent = 
                    String(hours).padStart(2, '0') + ':' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(secs).padStart(2, '0');
            }

            save() {
                if (this.seconds > 0) {
                    const now = new Date();
                    const item = {
                        type: this.type,
                        duration: this.seconds,
                        timestamp: now.toLocaleTimeString('en-US', { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            second: '2-digit'
                        }),
                        date: now.toLocaleDateString()
                    };
                    
                    addToHistory(item);
                    this.reset();
                }
            }
        }

        // Initialize timers
        const workTimer = new Timer('workDisplay', 'workStart', 'workStop', 'workReset', 'workSave', 'workStatus', 'work');
        const breakTimer = new Timer('breakDisplay', 'breakStart', 'breakStop', 'breakReset', 'breakSave', 'breakStatus', 'break');

        function getStorageKey() {
            const today = new Date().toLocaleDateString();
            return `timeTracking_${today}`;
        }

        function getHistory() {
            const key = getStorageKey();
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        function saveHistory(history) {
            const key = getStorageKey();
            localStorage.setItem(key, JSON.stringify(history));
        }

        function addToHistory(item) {
            const history = getHistory();
            history.push(item);
            saveHistory(history);
            renderHistory();
        }

        function deleteFromHistory(index) {
            const history = getHistory();
            history.splice(index, 1);
            saveHistory(history);
            renderHistory();
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            return String(hours).padStart(2, '0') + ':' +
                   String(minutes).padStart(2, '0') + ':' +
                   String(secs).padStart(2, '0');
        }

        function renderHistory() {
            const history = getHistory();
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-message">No timers yet. Start tracking your time!</div>';
                renderSummary([]);
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item ${item.type}">
                    <div class="history-item-info">
                        <div class="history-item-type">
                            ${item.type === 'work' ? '💼 Work Session' : '☕ Break Session'}
                        </div>
                        <div class="history-item-time">${item.timestamp}</div>
                    </div>
                    <div class="history-item-duration">${formatDuration(item.duration)}</div>
                    <button class="delete-btn" onclick="deleteFromHistory(${index})">Delete</button>
                </div>
            `).join('');

            renderSummary(history);
        }

        function renderSummary(history) {
            const totalWork = history
                .filter(item => item.type === 'work')
                .reduce((sum, item) => sum + item.duration, 0);

            const totalBreak = history
                .filter(item => item.type === 'break')
                .reduce((sum, item) => sum + item.duration, 0);

            const summary = document.getElementById('summary');
            if (history.length > 0) {
                summary.innerHTML = `
                    <div class="summary-item">
                        <div class="summary-label">Total Work Time</div>
                        <div class="summary-value">${formatDuration(totalWork)}</div>
                    </div>
                    <div class="summary-item break">
                        <div class="summary-label">Total Break Time</div>
                        <div class="summary-value">${formatDuration(totalBreak)}</div>
                    </div>
                `;
            } else {
                summary.innerHTML = '';
            }
        }

        // Load history on page load
        window.addEventListener('load', renderHistory);
    </script>
</body>
</html>
